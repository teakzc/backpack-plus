name: CI

on:
    pull_request:
        branches:
            - main

jobs:
    lint-and-build:
        name: Lint & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npx eslint src/

            - name: Build
              run: npm run build
